[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adversarial-detector-humanizer"
version = "0.1.0"
description = "Detector-verified, sentence-targeted, meaning-preserving text humanizer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Faheem Gurkani" }
]
keywords = [
  "ai-detection",
  "humanizer",
  "adversarial-paraphrasing",
  "register-shift",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pysbd>=0.3.4",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
local = [
  "huggingface-hub>=0.25",
  "joblib>=1.4",
  "numpy>=1.26",
  "peft>=0.13",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.1",
  "torch>=2.2",
  "transformers>=4.44",
]
pangram = [
  "pangram-sdk>=1.0",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "fastapi>=0.115",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "uvicorn>=0.30",
]

[project.scripts]
adh = "adh.cli:app"

[project.urls]
Homepage = "https://github.com/faheemgurkani/adversarial-detector-humanizer"
Repository = "https://github.com/faheemgurkani/adversarial-detector-humanizer"
Issues = "https://github.com/faheemgurkani/adversarial-detector-humanizer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/adh"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that download models or call networks",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
